<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>BADBOOL Tracker</title>
		<link rel="stylesheet" href="/src/style.css">
	</head>
	<body>
		<header>
			<h1>BADBOOL Tracker</h1>
			<p>
				Progress through the
				<a href="https://github.com/yaelwrites/Big-Ass-Data-Broker-Opt-Out-List" target="_blank" rel="noopener noreferrer">Big Ass Data Broker Opt-Out List</a>
				(people search sites, in priority order).
			</p>
			<p id="summary" aria-live="polite"></p>
			<progress id="progress-bar" value="0" max="1"></progress>
			<p id="legend"></p>
			<fieldset id="filters">
				<legend>Show</legend>
				<label><input type="checkbox" name="show" value="open" checked> Open</label>
				<label><input type="checkbox" name="show" value="requested" checked> Requested</label>
				<label><input type="checkbox" name="show" value="removed" checked> Removed</label>
				<label><input type="checkbox" name="show" value="not-present" checked> Not Present</label>
			</fieldset>
			<p id="save-status" role="status"></p>
		</header>
		<main id="entry-list"></main>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
