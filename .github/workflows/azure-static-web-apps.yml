name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - uses: pnpm/action-setup@v4
        with:
          # 12+, not 10: pnpm-workspace.yaml uses the `allowBuilds` key (pnpm 11+
          # renamed `onlyBuiltDependencies`), and `pnpm deploy --node-linker` is
          # relied on below.
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install and build web app
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Bundles api/ plus its production dependencies into a standalone folder,
      # resolved from the same pnpm lockfile as the web app — so api versions
      # are pinned rather than re-resolved on every deploy.
      # --node-linker=hoisted yields real directories instead of pnpm's symlink
      # farm, which matters because SWA uploads this folder verbatim
      # (skip_api_build: true) and symlinks would not survive the upload.
      - name: Bundle API with production dependencies
        run: pnpm deploy --filter=badbool-tracker-api --prod --node-linker=hoisted api-dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: "api-dist"
          output_location: "dist"
          skip_api_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request
    steps:
      - name: Close pull request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
